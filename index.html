    <title>live又滚了 - 时间轴</title>
    <style>
        /* 黑色背景与基础样式 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
        }

        h1 {
            font-size: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            color: #fff;
        }

        /* 时间轴整体容器 */
        .timeline {
            position: relative;
            padding-left: 20px;
            border-left: 2px solid #333;
            margin-top: 20px;
        }

        /* 单个时间轴节点 */
        .event-card {
            position: relative;
            margin-bottom: 30px;
        }

        /* 时间轴圆点 */
        .event-card::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #ff2442; /* 小红书同款品牌红点 */
        }

        .event-header {
            margin-bottom: 8px;
        }

        .event-date {
            font-size: 13px;
            color: #888;
            margin-right: 8px;
        }

        .event-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        /* 极小九宫格预览 */
        .grid-preview {
            display: grid;
            grid-template-columns: repeat(3, 48px); /* 控制每张缩略图的宽度，可自行调整 */
            gap: 4px;
            margin-top: 8px;
        }

        .grid-preview img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            background-color: #222;
        }

        /* 查看更多按钮 */
        .more-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
            text-decoration: none;
            border: 1px solid #444;
            padding: 3px 10px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .more-link:hover {
            color: #fff;
            border-color: #888;
            background-color: #222;
        }
    </style>
</head>
<body>
